### AI assisted (Claude) - healthcheck addition to fix matches not loading error ###

services:
  db:
    image: postgres:17
    container_name: pawmatchr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pawmatchr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  matching-service:
    build:
      context: ./matching-service
    container_name: pawmatchr_matching_service
    restart: unless-stopped
    env_file:
      - ./matching-service/.env
    ports:
      - "5001:5001"
    volumes:
      - ./matching-service:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build: 
      context: ./backend
    container_name: pawmatchr_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      matching-service:
        condition: service_healthy

volumes:
 pgdata: