services:
  db:
    image: postgres:17
    container_name: pawmatchr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pawmatchr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db:/docker-entrypoint-initdb.d

  matching-service:
    build:
      context: ./matching-service
    container_name: pawmatchr_matching_service
    restart: unless-stopped
    env_file:
      - ./matching-service/.env
    ports:
      - "5001:5001"
    volumes:
      - ./matching-service:/app

volumes:
 pgdata: